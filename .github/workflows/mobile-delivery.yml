name: Mobile delivery
on:
  push:
    branches: [feature/subsonic-navidrome-streaming, feature/navidrome-libraries-sync]
  workflow_dispatch:
    inputs:
      source_commit:
        description: 'Optional immutable application revision for an iOS-only release build'
        required: false
        default: ''
        type: string
      verify_only:
        description: 'Run checks for the immutable source without rebuilding mobile packages'
        required: false
        default: false
        type: boolean
      native_only:
        description: 'Compile and test native playback without packaging'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
concurrency:
  group: mobile-delivery-${{ github.ref }}-${{ inputs.native_only && 'native-only' || 'standard' }}-${{ inputs.verify_only && 'verify-only' || (inputs.source_commit != '' && 'ios-only' || 'full') }}
  cancel-in-progress: true
env:
  # The proprietary Discord SDK is not available in a clean fork. The existing
  # supported Lite configuration preserves all music/playback/transfer features.
  MORNYE_DISCORD_SDK: "0"
jobs:
  verify:
    if: ${{ !inputs.native_only && (inputs.source_commit == '' || inputs.verify_only) }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_commit || github.sha }}
      - name: Resolve verification source
        id: source
        env:
          REQUESTED_SOURCE: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          source=$(git rev-parse HEAD)
          if [ -n "$REQUESTED_SOURCE" ]; then
            [[ "$REQUESTED_SOURCE" =~ ^[0-9a-f]{40}$ ]]
            test "$source" = "$REQUESTED_SOURCE"
          fi
          echo "sha=$source" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Install verification tools
        timeout-minutes: 8
        run: |
          set -euo pipefail
          shopt -s nullglob
          missing=()
          command -v ffmpeg >/dev/null || missing+=(ffmpeg)
          clang_libraries=(/usr/lib/llvm-*/lib/libclang.so* /usr/lib/x86_64-linux-gnu/libclang-[0-9]*.so* /usr/local/lib/libclang.so*)
          if [ "${#clang_libraries[@]}" -eq 0 ]; then missing+=(libclang-dev); fi
          if [ "${#missing[@]}" -gt 0 ]; then
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 update
            sudo apt-get -o Acquire::Retries=2 -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 install -y "${missing[@]}"
          fi
          command -v ffmpeg
          printf 'Available libclang libraries: %s\n' "${clang_libraries[*]}"
      - run: flutter pub get && dart scripts/prepare_flutter_sdk.dart
      - run: flutter analyze --no-fatal-infos
      - name: Prepare native test assets
        run: |
          set -euo pipefail
          ready=false
          for attempt in 1 2 3; do
            if flutter test --no-pub test/library_media_identity_test.dart; then
              ready=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          "$ready"
      - run: mkdir -p build/test-results && flutter test --concurrency 4 --file-reporter json:build/test-results/flutter.jsonl
      - name: Delivery verifier tests
        if: always()
        run: python3 -m unittest discover -s scripts -p test_verify_delivery.py
      - name: Rust formatting, Clippy and tests
        if: ${{ !cancelled() }}
        run: bash scripts/check_rust_backend.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: verification-${{ steps.source.outputs.sha }}
          path: build/test-results/
          if-no-files-found: ignore
  android:
    if: ${{ !inputs.native_only && inputs.source_commit == '' && !inputs.verify_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MORNYE_RUST_ANDROID_ABIS: arm64-v8a,armeabi-v7a
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          distribution: temurin
          java-version: "25"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Install pinned Android components
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          curl --fail --location https://dl.google.com/android/repository/commandlinetools-linux-13114758_latest.zip -o "$RUNNER_TEMP/android-cli.zip"
          echo "5fdcc763663eefb86a5b8879697aa6088b041e70  $RUNNER_TEMP/android-cli.zip" | sha1sum --check
          unzip -q "$RUNNER_TEMP/android-cli.zip" -d "$RUNNER_TEMP/android-cli"
          manager="$RUNNER_TEMP/android-cli/cmdline-tools/bin/sdkmanager"
          yes | "$manager" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
          "$manager" --sdk_root="$ANDROID_HOME" "ndk;30.0.16248370" "platforms;android-37.0" "build-tools;37.0.0" "cmake;4.1.2"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/30.0.16248370" >> "$GITHUB_ENV"
      - name: Configure fork release signing
        run: |
          set -euo pipefail
          password=$(openssl rand -hex 32)
          echo "::add-mask::$password"
          keytool -genkeypair -keystore "$RUNNER_TEMP/mornye-delivery.jks" -storetype JKS -alias mornye-delivery -keyalg RSA -keysize 3072 -validity 10000 -dname "CN=Mornye Fork Delivery" -storepass "$password" -keypass "$password"
          printf 'storeFile=%s\nstorePassword=%s\nkeyPassword=%s\nkeyAlias=mornye-delivery\n' "$RUNNER_TEMP/mornye-delivery.jks" "$password" "$password" > android/key.properties
          chmod 600 android/key.properties "$RUNNER_TEMP/mornye-delivery.jks"
      - run: flutter pub get && dart scripts/prepare_flutter_sdk.dart
      - name: Test native timed radio metadata
        timeout-minutes: 8
        run: cd android && ./gradlew :audioplayers_android:testDebugUnitTest --tests 'xyz.luan.audioplayers.player.TimedId3MetadataTest' --console=plain
      - name: Restore Android native build cache
        continue-on-error: true
        id: android-rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: rust_backend/target
          key: mobile-lite-ndk30-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust_backend/Cargo.lock', 'rust_backend/Cargo.toml', 'rust_backend/rust-toolchain.toml', 'rust_backend/crates/**/Cargo.toml', 'rust_backend/crates/**/*.rs', 'scripts/build_rust_backend.sh') }}
      - name: Build actual release APKs
        run: bash scripts/build_android.sh --lite --target lib/main.dart
      - name: Save Android native build cache
        continue-on-error: true
        if: steps.android-rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: rust_backend/target
          key: ${{ steps.android-rust-cache.outputs.cache-primary-key }}
      - name: Verify and collect APKs
        run: |
          set -euo pipefail
          mkdir -p dist/android
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/android/Mornye.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/android/Mornye-armeabi-v7a.apk
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs dist/android/Mornye.apk
          python3 scripts/verify_delivery.py dist/android/Mornye.apk --commit "$GITHUB_SHA" --aapt "$ANDROID_HOME/build-tools/37.0.0/aapt2"
          sha256sum dist/android/*.apk > dist/android/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Mornye-Android-${{ github.sha }}
          path: dist/android/
          if-no-files-found: error
          retention-days: 30
      - name: Remove temporary signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/mornye-delivery.jks"
  ios:
    if: ${{ !inputs.native_only && !inputs.verify_only }}
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_commit || github.sha }}
      - name: Resolve application source revision
        id: source
        env:
          REQUESTED_SOURCE: ${{ inputs.source_commit }}
        run: |
          set -euo pipefail
          source=$(git rev-parse HEAD)
          if [ -n "$REQUESTED_SOURCE" ]; then
            [[ "$REQUESTED_SOURCE" =~ ^[0-9a-f]{40}$ ]] || { echo 'Expected a full commit SHA'; exit 1; }
            test "$source" = "$REQUESTED_SOURCE"
          fi
          echo "sha=$source" >> "$GITHUB_OUTPUT"
      - run: sudo xcode-select -s /Applications/Xcode_27.1.app && xcodebuild -version
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version-file: .fvmrc
          cache: true
      - name: Restore iOS native build cache
        continue-on-error: true
        id: ios-rust-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: rust_backend/target
          key: mobile-lite-xcode27-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust_backend/Cargo.lock', 'rust_backend/Cargo.toml', 'rust_backend/rust-toolchain.toml', 'rust_backend/crates/**/Cargo.toml', 'rust_backend/crates/**/*.rs', 'scripts/build_rust_backend.sh') }}
      - name: Build Rust iOS framework
        run: bash scripts/build_ios.sh
      - name: Save iOS native build cache
        continue-on-error: true
        if: steps.ios-rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: rust_backend/target
          key: ${{ steps.ios-rust-cache.outputs.cache-primary-key }}
      - run: flutter pub get && dart scripts/prepare_flutter_sdk.dart
      - name: Configure native pods
        run: |
          find "$HOME/.pub-cache/hosted" -path '*ffmpeg_kit_flutter_new_audio*/scripts/*.sh' -type f -exec perl -pi -e 's/\r$//' {} +
          cd ios && pod install
      - name: Build actual unsigned iOS release
        run: |
          set -euo pipefail
          built=false
          for attempt in 1 2 3; do
            if flutter build ios --release --no-codesign --target lib/main.dart --dart-define="GIT_COMMIT=$(git rev-parse --short=8 HEAD)"; then
              built=true
              break
            fi
            if [ "$attempt" -lt 3 ]; then sleep 10; fi
          done
          "$built"
      - name: Audit and package IPA
        run: |
          set -euo pipefail
          app=build/ios/iphoneos/Runner.app
          python3 scripts/check_backend_ios.py "$app" --backend rust --archs arm64 --platform ios --release
          mkdir -p dist/ios .tmp/ipa/Payload
          cp -R "$app" .tmp/ipa/Payload/
          (cd .tmp/ipa && zip -qr "$GITHUB_WORKSPACE/dist/ios/Mornye.ipa" Payload)
          python3 scripts/verify_delivery.py dist/ios/Mornye.ipa --commit "$(git rev-parse HEAD)"
          shasum -a 256 dist/ios/Mornye.ipa > dist/ios/SHA256SUMS.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: Mornye-iOS-${{ steps.source.outputs.sha }}
          path: dist/ios/
          if-no-files-found: error
          retention-days: 30
      - name: Test native AVPlayer lifecycle
        timeout-minutes: 5
        run: |
          set -euo pipefail
          native=third_party/audioplayers_darwin/darwin/audioplayers_darwin/Sources/audioplayers_darwin
          mkdir -p .tmp/native-tests
          xcrun swiftc -parse-as-library -target "$(uname -m)-apple-macos14.0" \
            "$native/WrappedMediaPlayer.swift" "$native/Utils.swift" "$native/AudioPlayerError.swift" \
            "$native/EqualizerAudioTap.swift" "$native/EqualizerDSP.swift" "$native/StreamMetadata.swift" \
            third_party/audioplayers_darwin/tests/SourceLifecycleTests.swift -o .tmp/native-tests/source-lifecycle
          .tmp/native-tests/source-lifecycle
      - name: Test AVPlayer with authenticated Subsonic streams
        timeout-minutes: 50
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || brew install ffmpeg
          mkdir -p .tmp/audio
          ffmpeg -v error -f lavfi -i sine=frequency=440:duration=2 -ar 44100 -ac 1 .tmp/audio/tone.flac
          ffmpeg -v error -f lavfi -i sine=frequency=440:duration=2 -ar 44100 -ac 1 .tmp/audio/tone.mp3
          mkdir -p .tmp/audio/hls
          ffmpeg -v error -f lavfi -i sine=frequency=440:duration=6 -ar 24000 -ac 1 -b:a 16k -c:a aac -hls_time 1 -hls_list_size 0 .tmp/audio/hls/live.m3u8
          python3 -c 'import base64,json,pathlib; root=pathlib.Path(".tmp/audio/hls"); pathlib.Path(".tmp/audio/hls.json.b64").write_text(base64.b64encode(json.dumps({p.name:base64.b64encode(p.read_bytes()).decode() for p in root.iterdir()}).encode()).decode())'
          python3 - <<'PY'
          import base64, json
          from pathlib import Path
          audio = Path('.tmp/audio')
          definitions = {
              'TEST_HLS': (audio / 'hls.json.b64').read_text(),
              'TEST_FLAC': base64.b64encode((audio / 'tone.flac').read_bytes()).decode(),
              'TEST_MP3': base64.b64encode((audio / 'tone.mp3').read_bytes()).decode(),
          }
          encoded_size = sum(len(base64.b64encode(f'{key}={value}'.encode())) + 1 for key, value in definitions.items())
          assert encoded_size < 160 * 1024, f'Playback fixtures exceed the Xcode argument/environment budget: {encoded_size}'
          (audio / 'test-defines.json').write_text(json.dumps(definitions))
          print(f'Playback fixture environment: {encoded_size} bytes')
          PY
          # Only boot runtimes supported by the selected Xcode simulator SDK.
          export SIMULATOR_SDK_VERSION="$(xcrun --sdk iphonesimulator --show-sdk-version)"
          device=$(xcrun simctl list devices available --json | python3 -c 'import json,os,re,sys; sdk=tuple(map(int,(os.environ["SIMULATOR_SDK_VERSION"].split(".")+["0"])[:2])); groups=json.load(sys.stdin)["devices"]; candidates=[(tuple(map(int,re.search(r"iOS-(\d+)-(\d+)",key).groups())),group) for key,group in groups.items() if re.search(r"iOS-(\d+)-(\d+)",key)]; print(next(d["udid"] for version,group in sorted(candidates,key=lambda item:item[0],reverse=True) if version[0]==sdk[0] and version<=sdk for d in group if "iPhone" in d["name"]))')
          simulator="$(xcode-select -p)/Applications/Simulator.app"
          if [ -d "$simulator" ]; then
            open -a "$simulator" --args -CurrentDeviceUDID "$device" || true
          fi
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          flutter test integration_test/subsonic_playback_test.dart --no-pub --verbose --timeout=2m -d "$device" --dart-define-from-file=.tmp/audio/test-defines.json 2>&1 | tee .tmp/ios-simulator.log
      - name: Collect simulator diagnostics
        if: always()
        timeout-minutes: 3
        run: |
          mkdir -p .tmp/ios-diagnostics
          cp .tmp/ios-simulator.log .tmp/ios-diagnostics/ 2>/dev/null || true
          xcrun simctl list devices available > .tmp/ios-diagnostics/devices.txt || true
          xcrun simctl spawn booted log show --last 10m --style compact --predicate 'process == "Runner"' > .tmp/ios-diagnostics/runner.log 2>&1 || true
          xcrun simctl io booted screenshot .tmp/ios-diagnostics/simulator.png || true
      - name: Preserve simulator diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: iOS-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: .tmp/ios-diagnostics/
          if-no-files-found: ignore
          retention-days: 7

  native:
    if: ${{ inputs.native_only }}
    runs-on: xcode-27
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.source_commit || github.sha }}
      - name: Prepare actual HLS audio fixture
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || brew install ffmpeg
          mkdir -p .tmp/radio
          ffmpeg -v error -f lavfi -i sine=frequency=440:duration=15 -c:a aac -hls_time 1 -hls_list_size 0 .tmp/radio/live.m3u8
          python3 -m http.server 18762 --bind 127.0.0.1 --directory .tmp/radio >.tmp/radio/http.log 2>&1 &
          echo "TEST_RADIO_HLS=http://127.0.0.1:18762/live.m3u8" >> "$GITHUB_ENV"
      - name: Test native AVPlayer lifecycle
        timeout-minutes: 5
        run: |
          set -euo pipefail
          native=third_party/audioplayers_darwin/darwin/audioplayers_darwin/Sources/audioplayers_darwin
          mkdir -p .tmp/native-tests
          xcrun swiftc -parse-as-library -target "$(uname -m)-apple-macos14.0" \
            "$native/WrappedMediaPlayer.swift" "$native/Utils.swift" "$native/AudioPlayerError.swift" \
            "$native/EqualizerAudioTap.swift" "$native/EqualizerDSP.swift" "$native/StreamMetadata.swift" \
            third_party/audioplayers_darwin/tests/SourceLifecycleTests.swift -o .tmp/native-tests/source-lifecycle
          .tmp/native-tests/source-lifecycle
