name: Native iOS audio diagnostic
on:
  workflow_dispatch:
  push:
    branches: [codex/official-531-integration]
    paths:
      - .github/workflows/native-ios-audio-diagnostic.yml
      - third_party/audioplayers_darwin/tests/IOSRadioProbe.swift
      - third_party/audioplayers_darwin/tests/ProbeFixtureServer.swift
      - third_party/audioplayers_darwin/darwin/audioplayers_darwin/Sources/audioplayers_darwin/*.swift
permissions:
  contents: read
jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build real WAV and both HLS controls
        run: |
          set -euo pipefail
          command -v ffmpeg >/dev/null || brew install ffmpeg
          mkdir -p .tmp/probe/audio/high .tmp/probe/audio/low .tmp/probe/audio/cmaf
          ffmpeg -v error -f lavfi -i sine=frequency=440:duration=15 -ar 44100 -ac 1 .tmp/probe/audio/tone.wav
          ffmpeg -v error -i .tmp/probe/audio/tone.wav -c:a flac .tmp/probe/audio/tone.flac
          ffmpeg -v error -i .tmp/probe/audio/tone.wav -c:a libmp3lame .tmp/probe/audio/tone.mp3
          ffmpeg -v error -i .tmp/probe/audio/tone.wav -c:a aac -hls_time 1 -hls_list_size 0 .tmp/probe/audio/high/live.m3u8
          ffmpeg -v error -i .tmp/probe/audio/tone.wav -c:a aac -hls_segment_type fmp4 -hls_time 1 -hls_list_size 0 .tmp/probe/audio/cmaf/live.m3u8
          ffmpeg -v error -f lavfi -i sine=frequency=440:duration=6 -ar 24000 -ac 1 -b:a 16k -c:a aac -hls_time 1 -hls_list_size 0 .tmp/probe/audio/low/live.m3u8
      - name: Compile and run standalone iOS audio application
        run: |
          set -euo pipefail
          native=third_party/audioplayers_darwin/darwin/audioplayers_darwin/Sources/audioplayers_darwin
          app=.tmp/probe/RadioProbe.app
          mkdir -p "$app"
          cp -R .tmp/probe/audio/. "$app/"
          python3 - <<'PY'
          import pathlib, plistlib
          info = dict(CFBundleExecutable="RadioProbe", CFBundleIdentifier="com.mornye.radio-probe", CFBundleName="RadioProbe", CFBundleDisplayName="Mornye EQ-test", CFBundlePackageType="APPL", CFBundleVersion="1", CFBundleShortVersionString="1", MinimumOSVersion="27.0", LSRequiresIPhoneOS=True, UILaunchScreen={}, NSAppTransportSecurity=dict(NSAllowsLocalNetworking=True))
          pathlib.Path(".tmp/probe/RadioProbe.app/Info.plist").write_bytes(plistlib.dumps(info))
          PY
          sdk=$(xcrun --sdk iphonesimulator --show-sdk-path)
          xcrun --sdk iphonesimulator swiftc -parse-as-library -sdk "$sdk" -target "$(uname -m)-apple-ios27.0-simulator" \
            "$native/WrappedMediaPlayer.swift" "$native/Utils.swift" "$native/AudioPlayerError.swift" \
            "$native/EqualizerAudioTap.swift" "$native/EqualizerDSP.swift" "$native/StreamMetadata.swift" \
            third_party/audioplayers_darwin/tests/IOSRadioProbe.swift third_party/audioplayers_darwin/tests/ProbeFixtureServer.swift -o "$app/RadioProbe"
          # Build a separate unsigned device IPA so the same counters can be
          # checked on a real iPhone/Bluetooth route without a Mac or NAS login.
          physical=.tmp/probe/device/Payload/RadioProbe.app
          mkdir -p "$physical"
          cp -R .tmp/probe/audio/. "$physical/"
          cp "$app/Info.plist" "$physical/Info.plist"
          sdk_device=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun --sdk iphoneos swiftc -parse-as-library -sdk "$sdk_device" -target arm64-apple-ios27.0 \
            "$native/WrappedMediaPlayer.swift" "$native/Utils.swift" "$native/AudioPlayerError.swift" \
            "$native/EqualizerAudioTap.swift" "$native/EqualizerDSP.swift" "$native/StreamMetadata.swift" \
            third_party/audioplayers_darwin/tests/IOSRadioProbe.swift third_party/audioplayers_darwin/tests/ProbeFixtureServer.swift -o "$physical/RadioProbe"
          (cd .tmp/probe/device && zip -qr ../Mornye-EQ-Diagnostics.ipa Payload)
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; a=[v for k,vs in d.items() if "iOS-27-2" in k for v in vs if v["name"].startswith("iPhone")]; assert a, "No iOS 27.2 iPhone"; print(a[0]["udid"])')
          xcrun simctl boot "$device" || true
          xcrun simctl bootstatus "$device" -b
          # simctl can boot headlessly. Start the host device UI/audio bridge
          # as well before judging whether an iOS audio tap processes samples.
          hub="$(dirname "$(xcode-select -p)")/Applications/DeviceHub.app"
          test -d "$hub"
          open -g -a "$hub" --args -CurrentDeviceUDID "$device"
          system_profiler SPAudioDataType -json >.tmp/probe/host-audio.json
          pgrep -fl 'DeviceHub|Simulator|CoreSimulator' >.tmp/probe/audio-host.txt || true
          xcrun simctl install "$device" "$app"
          xcrun simctl launch "$device" com.mornye.radio-probe
          data=$(xcrun simctl get_app_container "$device" com.mornye.radio-probe data)
          for attempt in $(seq 1 240); do
            if [ -f "$data/Documents/native-audio-results.json" ]; then
              cp "$data/Documents/native-audio-results.json" .tmp/probe/results.json
              break
            fi
            sleep 0.5
          done
          test -f .tmp/probe/results.json
          cat .tmp/probe/results.json
          python3 - <<'PY'
          import json
          rows=json.load(open(".tmp/probe/results.json"))
          assert len(rows)==14, rows
          for row in rows:
              stats=row.get("stats",{})
              assert stats.get("processedFrames",0)>=22050, row
              assert stats.get("inputRms",0)>0, row
              ratio=stats["outputRms"]/stats["inputRms"]
              assert 0.20<=ratio<=0.35, row
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: native-ios-audio-probe-${{ github.sha }}
          path: |
            .tmp/probe/results.json
            .tmp/probe/Mornye-EQ-Diagnostics.ipa
            .tmp/probe/http.log
            .tmp/probe/host-audio.json
            .tmp/probe/audio-host.txt
          if-no-files-found: ignore
